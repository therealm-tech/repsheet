default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args:
          - --allow-multiple-documents
      - id: check-toml
      - id: check-json
        # tsconfig files are JSONC (comments, trailing commas).
        exclude: tsconfig.*\.json$
      - id: check-added-large-files
        exclude: ^repsheet-webapp/package-lock\.json$
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args:
          - --strict

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.4.0
    hooks:
      - id: sqlfluff-lint

  - repo: local
    hooks:
      - id: no-co-authors
        name: no co-authors in commit message
        entry: '^\s*co-authored-by:|\bgenerated with\b'
        language: pygrep
        args:
          - --ignore-case
        stages:
          - commit-msg
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types:
          - shell
      - id: trivy-dockerfile
        name: trivy config (Dockerfile)
        entry: trivy config --exit-code 1 Dockerfile
        language: system
        pass_filenames: false
        files: ^Dockerfile$
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        types:
          - rust
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --locked -- -D warnings
        language: system
        files: (\.rs|Cargo\.toml|Cargo\.lock|\.sql)$
        pass_filenames: false
      # Runs the Biome version pinned in the webapp's lockfile, with the
      # biome.json that lives next to it.
      - id: biome-check
        name: biome check
        entry: bash -c 'cd repsheet-webapp && npx --no-install biome check --write --error-on-warnings'
        language: system
        files: ^repsheet-webapp/
        types_or:
          - ts
          - tsx
          - javascript
          - json
          - css
        pass_filenames: false
      - id: tsc
        name: tsc
        entry: bash -c 'cd repsheet-webapp && npx --no-install tsc -b --noEmit'
        language: system
        files: ^repsheet-webapp/.*\.(ts|tsx|json)$
        pass_filenames: false
