{{- if not .Values.api.superAdmin.existingSecret.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "repsheet.api.superAdminSecretName" . }}
  labels:
    {{- include "repsheet.labels" (dict "root" . "component" "api") | nindent 4 }}
type: Opaque
stringData:
  SUPER_ADMIN_PASSWORD: {{ required "api.superAdmin.password or api.superAdmin.existingSecret.name is required" .Values.api.superAdmin.password | quote }}
{{- end }}
