{{- if include "repsheet.api.caCertsGenerateSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "repsheet.api.caCertsSecretName" . }}
  labels:
    {{- include "repsheet.labels" (dict "root" . "component" "api") | nindent 4 }}
type: Opaque
stringData:
  {{ include "repsheet.api.caCertsKey" . }}: |
    {{- .Values.api.caCerts.inline | nindent 4 }}
{{- end }}
