{{- if not .Values.api.database.existingSecret.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "repsheet.api.databaseSecretName" . }}
  labels:
    {{- include "repsheet.labels" (dict "root" . "component" "api") | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "api.database.url or api.database.existingSecret.name is required" .Values.api.database.url | quote }}
{{- end }}
