{{- $c := include "repsheet.values" (dict "root" . "component" "api") | fromYaml }}
{{- if $c.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "repsheet.serviceAccountName" (dict "root" . "component" "api" "values" $c) }}
  labels:
    {{- include "repsheet.labels" (dict "root" . "component" "api") | nindent 4 }}
  {{- with $c.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
