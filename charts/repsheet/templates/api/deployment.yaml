{{- $c := include "repsheet.values" (dict "root" . "component" "api") | fromYaml }}
{{- include "repsheet.api.caCertsValidate" . }}
{{- $caCerts := include "repsheet.api.caCertsEnabled" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "repsheet.componentName" (dict "root" . "component" "api") }}
  labels:
    {{- include "repsheet.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  replicas: {{ $c.replicaCount }}
  revisionHistoryLimit: {{ $c.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "repsheet.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      {{- $annotations := dict }}
      {{- if not .Values.api.database.existingSecret.name }}
      {{- $_ := set $annotations "checksum/database" (include (print $.Template.BasePath "/api/secret/database.yaml") . | sha256sum) }}
      {{- end }}
      {{- if not .Values.api.superAdmin.existingSecret.name }}
      {{- $_ := set $annotations "checksum/super-admin" (include (print $.Template.BasePath "/api/secret/super-admin.yaml") . | sha256sum) }}
      {{- end }}
      {{- if include "repsheet.api.caCertsGenerateSecret" . }}
      {{- $_ := set $annotations "checksum/ca-certs" (include (print $.Template.BasePath "/api/secret/ca-certs.yaml") . | sha256sum) }}
      {{- end }}
      {{- with merge $annotations ($c.podAnnotations | default dict) }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "repsheet.selectorLabels" (dict "root" . "component" "api") | nindent 8 }}
        {{- with $c.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "repsheet.serviceAccountName" (dict "root" . "component" "api" "values" $c) }}
      automountServiceAccountToken: false
      {{- with $c.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $c.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "repsheet.image" (dict "root" . "values" $c) }}
          imagePullPolicy: {{ $c.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: BIND_ADDR
              value: "0.0.0.0:3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "repsheet.api.databaseSecretName" . }}
                  key: {{ include "repsheet.api.databaseSecretKey" . }}
            - name: DB_MAX_CONNECTIONS
              value: {{ $c.database.maxConnections | quote }}
            - name: SUPER_ADMIN_EMAIL
              value: {{ required "api.superAdmin.email is required" $c.superAdmin.email | quote }}
            - name: SUPER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "repsheet.api.superAdminSecretName" . }}
                  key: {{ include "repsheet.api.superAdminSecretKey" . }}
            - name: TOKEN_TTL_DAYS
              value: {{ $c.tokenTtlDays | quote }}
            - name: LOG_FILTER
              value: {{ $c.log.filter | quote }}
            - name: LOG_FORMAT
              value: {{ $c.log.format | quote }}
            {{- if $caCerts }}
            {{- /* sqlx reads libpq's variable; its bundled rustls roots ignore SSL_CERT_FILE. */}}
            - name: PGSSLROOTCERT
              value: {{ include "repsheet.api.caCertsPath" . }}
            {{- end }}
            {{- with $c.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            {{- toYaml $c.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml $c.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml $c.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          securityContext:
            {{- toYaml $c.securityContext | nindent 12 }}
          {{- if or $caCerts $c.extraVolumeMounts }}
          volumeMounts:
            {{- if $caCerts }}
            - name: ca-certs
              mountPath: {{ include "repsheet.api.caCertsPath" . }}
              subPath: {{ include "repsheet.api.caCertsKey" . }}
              readOnly: true
            {{- end }}
            {{- with $c.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or $caCerts $c.extraVolumes }}
      volumes:
        {{- if $caCerts }}
        - name: ca-certs
          {{- if include "repsheet.api.caCertsFromConfigMap" . }}
          configMap:
            name: {{ include "repsheet.api.caCertsSecretName" . }}
          {{- else }}
          secret:
            secretName: {{ include "repsheet.api.caCertsSecretName" . }}
          {{- end }}
        {{- end }}
        {{- with $c.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with $c.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
