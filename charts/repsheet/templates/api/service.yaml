{{- $c := include "repsheet.values" (dict "root" . "component" "api") | fromYaml }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "repsheet.componentName" (dict "root" . "component" "api") }}
  labels:
    {{- include "repsheet.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  type: {{ $c.service.type }}
  selector:
    {{- include "repsheet.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ $c.service.port }}
      targetPort: http
      protocol: TCP
