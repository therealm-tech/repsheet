{{- if .Values.ingress.enabled }}
{{- $webapp := include "repsheet.values" (dict "root" . "component" "webapp") | fromYaml }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "repsheet.fullname" . }}
  labels:
    {{- include "repsheet.labels" (dict "root" .) | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts | default (list "") }}
    - {{ with . }}host: {{ . | quote }}
      {{ end }}http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "repsheet.componentName" (dict "root" $ "component" "webapp") }}
                port:
                  number: {{ $webapp.service.port }}
    {{- end }}
{{- end }}
