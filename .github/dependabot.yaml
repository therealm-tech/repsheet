version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "api:"
    groups:
      cargo:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /repsheet-webapp
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "webapp:"
    groups:
      # The router and the query client each ship lockstep packages.
      tanstack:
        patterns:
          - "@tanstack/*"
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      # react-i18next requires a matching i18next major as a peer
      # dependency: bumped one at a time, each PR fails to install.
      i18next:
        patterns:
          - i18next
          - react-i18next
      npm:
        # Dependabot gives a dependency to its most specific matching group,
        # not the first: a wildcard pattern ranks below this pattern-less
        # group, so `tanstack` stays empty unless excluded here.
        # https://github.com/dependabot/dependabot-core/issues/14576
        exclude-patterns:
          - "@tanstack/*"
          - i18next
          - react-i18next
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels:
      - dependencies
    commit-message:
      prefix: "docker:"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels:
      - dependencies
    commit-message:
      prefix: "docker:"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    labels:
      - dependencies
    commit-message:
      prefix: "ci:"
    groups:
      github-actions:
        update-types:
          - minor
          - patch
