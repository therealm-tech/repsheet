services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: repsheet
      POSTGRES_PASSWORD: repsheet
      POSTGRES_DB: repsheet
    ports:
      - 5433:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD
        - pg_isready
        - --username=repsheet
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles:
      - app
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgres://repsheet:repsheet@postgres:5432/repsheet
      SUPER_ADMIN_EMAIL: admin@repsheet.localhost
      SUPER_ADMIN_PASSWORD: repsheet-admin
    ports:
      - 3100:3000
    depends_on:
      postgres:
        condition: service_healthy

  webapp:
    profiles:
      - app
    build:
      context: .
      target: webapp
    environment:
      API_HOST: api:3000
    ports:
      - 8100:8080
    depends_on:
      - api

volumes:
  postgres_data:
